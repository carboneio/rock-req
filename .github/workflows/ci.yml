name: ci

on:
  push:
    branches: ['**'] # tags are tested by publish.yml
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # oldest supported (engines >=16) and latest Node on Linux, latest on macOS and Windows
        include:
          - { os: ubuntu-latest, node: 16 }
          - { os: ubuntu-latest, node: 26 }
          - { os: macos-latest, node: 26 }
          - { os: windows-latest, node: 26 }
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
