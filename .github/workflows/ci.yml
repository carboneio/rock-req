name: ci

on:
  - push
  - pull_request

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # oldest supported (engines >=16) and latest Node on Linux, latest on macOS and Windows
        include:
          - { os: ubuntu-latest, node: 16 }
          - { os: ubuntu-latest, node: 26 }
          - { os: macos-latest, node: 26 }
          - { os: windows-latest, node: 26 }
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
